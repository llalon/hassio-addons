name: Rclone
version: 0.0.3
slug: rclone
description: Rclone daemon and web UI, integrated with Home Assistant Ingress.
url: https://github.com/llalon/hassio-addons
startup: application
boot: auto
init: false
arch:
  - amd64
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:cloud-sync
panel_title: Rclone
panel_admin: true
ports: {}
map:
  - type: data
    path: /root/.cache/rclone
    read_only: false
  - type: app_config
    read_only: false
    path: /root/.config/rclone
  - type: share
    read_only: false
  - type: media
    read_only: false
  - type: backup
    read_only: true
options: {}
schema: {}
