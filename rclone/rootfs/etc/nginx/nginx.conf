worker_processes auto;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    access_log /dev/stdout;
    error_log /dev/stderr notice;
    sub_filter_once on;

    server {
        listen 8099;
        server_name _;

        # Home Assistant Supervisor is the only client allowed to reach Ingress.
        allow 172.30.32.2;
        deny all;

        # The UI calls every Rclone RC endpoint (POST only) under /rc/.
        location /rc/ {
            proxy_pass http://127.0.0.1:5572/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }

        # File downloads use a temporary rclone HTTP serve on a random
        # container-local port, reached through /serve/<port>/.
        location ~ ^/serve/(\d+)/(.*)$ {
            proxy_pass http://127.0.0.1:$1/$2$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            sub_filter '</head>' '<script>var p="$http_x_ingress_path"||"/";if(p.charAt(p.length-1)!=="/")p+="/";var b=p.length>1?p.slice(0,-1):"/";window.__RCLONE_INGRESS_BASE__=b;window.__RCLONE_INGRESS_URL__=window.location.origin+p;var base=document.createElement("base");base.href=p;document.head.prepend(base);</script></head>';
        }
    }
}
