worker_processes auto;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    access_log /dev/stdout;
    error_log /dev/stderr notice;
    sub_filter_once on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8099;
        server_name _;

        # Home Assistant Supervisor is the only client allowed to reach Ingress.
        allow 172.30.32.2;
        deny all;

        location / {
            error_page 418 = @rclone_api;

            if ($request_method !~ ^(GET|HEAD)$) {
                return 418;
            }

            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            sub_filter '</head>' '<script>var p="$http_x_ingress_path"||"/";if(p.charAt(p.length-1)!=="/")p+="/";var b=p.length>1?p.slice(0,-1):"/";window.__RCLONE_INGRESS_BASE__=b;window.__RCLONE_INGRESS_URL__=window.location.origin+p;var base=document.createElement("base");base.href=p;document.head.prepend(base);</script></head>';
        }

        location @rclone_api {
            proxy_pass http://127.0.0.1:5572;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
    }
}
